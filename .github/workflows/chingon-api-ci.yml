name: Chingon API CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew assemble

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: chingon-api-jar
          path: build/libs/*.jar
